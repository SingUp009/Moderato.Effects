<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wasm Runner Spike</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 16px; background: #fff; color: #111; }
    main { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    textarea { width: 100%; height: 420px; font: 13px/1.4 ui-monospace, monospace; box-sizing: border-box; }
    pre { background: #f4f4f4; padding: 8px; min-height: 120px; max-height: 300px; overflow: auto; white-space: pre-wrap; }
    table { border-collapse: collapse; font-size: 13px; }
    td, th { border: 1px solid #ccc; padding: 2px 8px; text-align: right; }
    td:first-child, th:first-child { text-align: left; }
    .err { color: #b00; }
    button { margin-right: 8px; }
  </style>
</head>
<body>
  <p>Status: <strong id="status">booting…</strong></p>
  <main>
    <section>
      <textarea id="editor" spellcheck="false"></textarea>
      <p>
        <button id="run">Run (Ctrl+Enter)</button>
        <button id="stop">Stop</button>
        <button id="bench">Benchmark</button>
      </p>
      <pre id="diagnostics"></pre>
    </section>
    <section>
      <pre id="output"></pre>
      <table id="metrics"><tbody></tbody></table>
    </section>
  </main>
  <script type="module" src="./main.js"></script>
</body>
</html>
