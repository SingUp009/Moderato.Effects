name: Agent DX offline

on:
  pull_request:
    paths: ['agent-dx/**', '.github/workflows/agent-dx.yml']
  push:
    branches: [main]
    paths: ['agent-dx/**', '.github/workflows/agent-dx.yml']

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: agent-dx/global.json
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: document/.node-version
          package-manager-cache: false
      - run: node --test agent-dx/offline.test.mjs
