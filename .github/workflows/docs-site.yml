name: Documentation site

on:
  push:
    branches: [main]
    paths:
      - 'document/web/**'
      - 'document/tour/**'
      - 'src/Moderato.Effects/**'
      - 'src/Moderato.Effects.SourceGenerator/**'
      - 'global.json'
      - '.github/workflows/docs-site.yml'
  pull_request:
    paths:
      - 'document/web/**'
      - 'document/tour/**'
      - 'src/Moderato.Effects/**'
      - 'src/Moderato.Effects.SourceGenerator/**'
      - 'global.json'
      - '.github/workflows/docs-site.yml'
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a deploy halfway; superseded pull request builds can go.
concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: document/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Workers Builds has no .NET SDK, which the tutorial playground's in-browser runner needs, so the site is built and deployed here.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      # InvariantGlobalization relinks the WebAssembly runtime, which needs the wasm-tools workload.
      - run: dotnet workload install wasm-tools

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: document/web/.node-version
          cache: npm
          cache-dependency-path: document/web/package-lock.json

      - run: npm ci

      - run: npm run runner

      # Builds the site and runs its tests.
      - run: npm run build

      - name: Deploy to Cloudflare Workers
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
