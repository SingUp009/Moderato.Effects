name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      # Compiler warnings, the analyzers and the .editorconfig code style rules are all errors.
      - run: dotnet build -c Release

      # Naming and other style rules that the build does not enforce.
      - run: dotnet format style --verify-no-changes --severity warn --no-restore

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - run: dotnet format whitespace --verify-no-changes

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - run: dotnet test -c Release

      - name: Verify deep composition in isolated processes
        run: |
          dotnet build tests/Moderato.Effects.StackSafetyProbe -c Release
          bash tests/Moderato.Effects.StackSafetyProbe/verify.sh dotnet tests/Moderato.Effects.StackSafetyProbe/bin/Release/net11.0/Moderato.Effects.StackSafetyProbe.dll

      - name: Run the samples
        run: |
          dotnet run --project samples/Moderato.Effects.Samples -c Release
          dotnet run --project samples/Moderato.Effects.Hosting.Samples -c Release

  pack:
    needs: [lint, format, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Select and verify the package version
        run: |
          version=$(dotnet msbuild src/Moderato.Effects -getProperty:Version)
          hosting_version=$(dotnet msbuild src/Moderato.Effects.Hosting -getProperty:Version)
          if [ "$version" != "$hosting_version" ]; then
            echo "::error::Core and Hosting development versions must match"
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [ "v$version" != "$GITHUB_REF_NAME" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match <Version>$version</Version>"
              exit 1
            fi
          else
            version="${version%%-*}-ci.$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT"
          fi
          mkdir -p artifacts
          echo "$version" > artifacts/version.txt
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Pack Core and Hosting
        run: |
          dotnet pack src/Moderato.Effects -c Release -p:Version=$VERSION -o artifacts
          dotnet pack src/Moderato.Effects.Hosting -c Release -p:Version=$VERSION -o artifacts
          python3 tests/verify-packages.py artifacts "$VERSION" "$GITHUB_SHA"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: packages
          path: artifacts/
          if-no-files-found: error

  package:
    needs: pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: packages
          path: artifacts

      - name: Find the packed version
        run: echo "VERSION=$(cat artifacts/version.txt)" >> "$GITHUB_ENV"

      - name: Run a consumer of the package
        run: dotnet run --project tests/Moderato.Effects.PackageTests -c Release -p:ModeratoEffectsVersion=$VERSION

      - name: Check that the package's analyzers run
        run: |
          if dotnet build tests/Moderato.Effects.PackageTests -c Release -p:ModeratoEffectsVersion=$VERSION -p:CheckAnalyzers=true > analyzers.log; then
            echo "::error::Misuse.cs built, so the analyzers did not run"
            exit 1
          fi
          grep -q "error MEFF301" analyzers.log || { cat analyzers.log; echo "::error::MEFF301 was not reported"; exit 1; }

      - name: Publish and run the consumer with Native AOT
        run: |
          dotnet publish tests/Moderato.Effects.PackageTests -c Release -r linux-x64 -p:ModeratoEffectsVersion=$VERSION -o aot
          ./aot/Moderato.Effects.PackageTests

      - name: Run a consumer referencing only the Hosting package
        run: dotnet run --project tests/Moderato.Effects.Hosting.PackageTests -c Release -p:ModeratoEffectsVersion=$VERSION

      - name: Check analyzers through the Hosting dependency
        run: |
          if dotnet build tests/Moderato.Effects.Hosting.PackageTests -c Release -p:ModeratoEffectsVersion=$VERSION -p:CheckAnalyzers=true > hosting-analyzers.log; then
            echo "::error::Hosting consumer misuse built without the expected analyzer error"
            exit 1
          fi
          grep -q "error MEFF301" hosting-analyzers.log || { cat hosting-analyzers.log; exit 1; }

      - name: Publish and run the Hosting consumer with Native AOT
        run: |
          dotnet publish tests/Moderato.Effects.Hosting.PackageTests -c Release -r linux-x64 -p:ModeratoEffectsVersion=$VERSION -o aot-hosting
          ./aot-hosting/Moderato.Effects.Hosting.PackageTests

      - name: Verify deep composition in the native package consumer
        run: |
          dotnet publish tests/Moderato.Effects.StackSafetyProbe -c Release -r linux-x64 -p:ModeratoEffectsVersion=$VERSION -o aot-probe
          bash tests/Moderato.Effects.StackSafetyProbe/verify.sh ./aot-probe/Moderato.Effects.StackSafetyProbe

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [pack, package]
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write # NuGet Trusted Publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: packages
          path: artifacts

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - run: >
          dotnet nuget push "artifacts/*.nupkg"
          -s https://api.nuget.org/v3/index.json
          -k "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --skip-duplicate
